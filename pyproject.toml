[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-trading-analytics"
version = "0.2.0"
description = "Pull your Bybit Unified Trading Account history via the V5 API and analyse your trading performance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://bybit-trading-analytics.vercel.app"
Repository = "https://github.com/fleming-c137/bybit-trading-analytics"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bybit-analytics = "bybit_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
