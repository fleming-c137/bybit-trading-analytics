      <stop offset="0.5" stop-color="#9aa0aa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9aa0aa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
