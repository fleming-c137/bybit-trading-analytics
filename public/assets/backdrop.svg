      <stop offset="0.5" stop-color="#d9d4cf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d9d4cf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#e8641c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8641c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
