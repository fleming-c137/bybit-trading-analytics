      <stop offset="0" stop-color="#16181d"/>
      <stop offset="0.45" stop-color="#2c2f36"/>
      <stop offset="0.62" stop-color="#4a4544"/>
      <stop offset="0.72" stop-color="#6b5446"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5f66"/>
      <stop offset="1" stop-color="#3b3d43"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
